<!DOCTYPE html>
<html lang="en">
<head>
<style>
  :root {
    --dbt-teal: #008ba3;
    --dbt-bg: #f4f6f8;
  }

  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background-color: var(--dbt-bg);
    padding: 50px;
  }

  /* Container for the tree */
  .tree-container {
    display: flex;
    align-items: center;
  }

  /* Individual Model Node */
  .node-card {
    width: 220px;
    background: white;
    border: 2px solid var(--dbt-teal);
    border-radius: 8px;
    overflow: hidden;
    box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    position: relative;
  }

  .node-header {
    background-color: var(--dbt-teal);
    color: white;
    padding: 6px 12px;
    font-size: 10px;
    font-weight: bold;
    display: flex;
    align-items: center;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .node-header img {
    width: 14px;
    margin-right: 8px;
  }

  .node-body {
    padding: 12px;
    font-weight: 600;
    color: #333;
    font-size: 14px;
    text-align: center;
  }

  /* Connecting Lines (Connector) */
  .connector {
    width: 40px;
    height: 2px;
    background-color: #cbd5e0;
    position: relative;
  }

  /* Hover effect */
  .node-card:hover {
    transform: translateY(-2px);
    transition: 0.2s ease;
    cursor: pointer;
  }
</style>
</head>
<body>

<div class="tree-container">
  
  <div class="node-card">
    <div class="node-header">
      <span style="background:#ff694b; border-radius:50%; width:12px; height:12px; display:inline-block; margin-right:5px;"></span>
      MODEL
    </div>
    <div class="node-body">
      src_imdb_data
    </div>
  </div>

  <div class="connector"></div>

  <div class="node-card">
    <div class="node-header">
      <span style="background:#ff694b; border-radius:50%; width:12px; height:12px; display:inline-block; margin-right:5px;"></span>
      MODEL
    </div>
    <div class="node-body">
      stg_imdb_ratings
    </div>
  </div>

  <div class="connector"></div>

  <div class="node-card">
    <div class="node-header">
      <span style="background:#ff694b; border-radius:50%; width:12px; height:12px; display:inline-block; margin-right:5px;"></span>
      MODEL
    </div>
    <div class="node-body">
      fct_movie_rankings
    </div>
  </div>

</div>

</body>
</html>
